# .github/workflows/deploy-watcher-test.yml in mergedeyes/watcher
# Every push to main (= every merged PR) builds Watcher on the homelab runner (CT 111)
# and installs it on the test instance (CT 110). A newer push cancels a running deploy.
name: Deploy to watcher-test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-watcher-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: watcher-test
    timeout-minutes: 30
    env:
      # Outside the workspace, so builds stay warm between runs.
      CARGO_TARGET_DIR: /var/cache/ci/watcher-target
      # The PVE host is a Haswell Xeon (AVX2/FMA/BMI2).
      RUSTFLAGS: -C target-cpu=x86-64-v3
      # Compile on more cores for test builds
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Build web UI
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: Build
        run: cargo build --release --locked

      - name: Deploy to watcher-test
        id: deploy
        run: |
          bin="$CARGO_TARGET_DIR/release/watcher"
          ssh -T -i ~/.ssh/watcher-test-deploy -o BatchMode=yes root@192.168.178.83 \
            "$(sha256sum < "$bin" | cut -d' ' -f1)" < "$bin" | tee /tmp/deploy.out
          echo "result=$(tail -1 /tmp/deploy.out)" >> "$GITHUB_OUTPUT"

      # Push to the homelab-ops ntfy topic (~runner/.config/ntfy-topic on CT 111).
      # Not on cancel: a cancelled run was superseded by a newer push.
      - name: Notify
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
          RESULT: ${{ steps.deploy.outputs.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = success ]; then
            title="watcher-test: ${RESULT:-deployed}"; prio=low; tags=white_check_mark
          else
            title="watcher-test deploy FAILED"; prio=high; tags=x
          fi
          msg="${GITHUB_SHA::7} ${COMMIT_MSG%%$'\n'*}"
          curl -fsS -o /dev/null -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" \
            -H "Click: $RUN_URL" --data-binary "$msg" "https://ntfy.sh/$(cat ~/.config/ntfy-topic)" \
            || echo "::warning::ntfy push failed"
