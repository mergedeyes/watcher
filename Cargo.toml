[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/mergedeyes/watcher"
authors = ["mergedeyes <github@mergedcloud.de>"]
# An application, not a library: nothing is published to crates.io.
publish = false

[workspace.dependencies]
watcher-config = { path = "crates/config" }
watcher-core = { path = "crates/core" }
watcher-exec = { path = "crates/exec" }
watcher-hub = { path = "crates/hub" }
watcher-notify = { path = "crates/notify" }
watcher-store = { path = "crates/store" }

anyhow = "1"
argon2 = "0.6"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
http-body-util = "0.1"
humantime = "2"
# TLS uses rustls with the ring provider throughout (as sqlx does); the
# binary installs ring as the process default for reqwest.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
notify = "8"
nix = { version = "0.31", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rpassword = "7"
rust-embed = { version = "8", features = ["mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shell-words = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
toml_edit = "0.25"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
