[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
repository = "https://github.com/mergedeyes/watcher"
authors = ["mergedeyes <github@mergedcloud.de>"]
# An application, not a library: nothing is published to crates.io.
publish = false

[workspace.dependencies]
watcher-config = { path = "crates/config" }
watcher-core = { path = "crates/core" }
watcher-exec = { path = "crates/exec" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
