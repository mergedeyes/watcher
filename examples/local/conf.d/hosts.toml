[hostgroup.linux]
title = "Linux Servers"
servicegroups = ["linux"]
host_check = "load"

[hostgroup.web]
title = "Web Servers"
services = ["http"]

[[host]]
name = "localhost"
address = "127.0.0.1"
groups = ["linux"]
services = ["uptime", "backup"]
vars.disks.root = { path = "/" }

[[host]]
name = "example.com"
groups = ["web"]
vars.url = "/"
