# What to run. Bare plugin names are found in the check directories
# (checks/ next to watcher.toml, then the monitoring-plugins directories).

[check.disk]
command = "check_disk -w $warn$ -c $crit$ -p $path$"
vars = { warn = "20%", crit = "10%" }

[check.load]
command = "check_load -w 5,4,3 -c 10,8,6"

[check.http]
command = "check_http -H $host.address$ -u $url$"
vars.url = "/"
# Bare numbers are milliseconds for time metrics.
thresholds.time = { warn = "> 500", crit = "> 2s" }

# Any script is a check: key=value output becomes metrics.
[check.uptime]
shell = true
command = 'echo "uptime=$(cut -d" " -f1 /proc/uptime)s"'
