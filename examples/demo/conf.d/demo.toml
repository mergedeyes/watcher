# Checks run every few seconds so graphs fill quickly.
[template.fast]
interval = "3s"
retry_interval = "2s"
max_attempts = 3
shell = true

# Hosts get UP/DOWN from their ping check.
[template.server]
check = "ping"

[[host]]
use = "server"
name = "web01"
address = "10.0.1.11"
tags = ["linux", "web"]

[[host]]
use = "server"
name = "web02"
address = "10.0.1.12"
tags = ["linux", "web"]

[[host]]
use = "server"
name = "db01"
address = "10.0.2.21"
tags = ["linux", "db"]
vars.role = "primary"

[[host]]
use = "server"
name = "mq-01"
address = "10.0.3.31"
tags = ["linux"]

[[host]]
use = "server"
name = "backup01"
address = "10.0.4.41"

[[host]]
use = "server"
name = "as400-prod"
address = "10.0.9.5"
tags = ["ibmi"]

# backup01 is DOWN; notifications for its other services are held back.
[[check]]
name = "ping"
use = "fast"
apply_to = 'host.name ~ "."'
command = 'if [ $host.name$ = backup01 ]; then echo "PING CRITICAL - Packet loss = 100%"; exit 2; fi; echo "PING OK - Packet loss = 0%, RTA = 0.$((RANDOM % 9 + 1)) ms | rta=0.$((RANDOM % 9 + 1))ms;100;500 pl=0%;20;60"'

# Changes state every 6 s: flap detection starts after a few changes.
[[check]]
name = "flappy"
use = "fast"
hosts = ["web02"]
max_attempts = 1
command = 'if [ $(( $(date +%s) / 6 % 2 )) = 0 ]; then echo "SVC OK"; else echo "SVC CRITICAL - down"; exit 2; fi'

[[check]]
name = "load"
use = "fast"
apply_to = 'host.tags contains "linux"'
command = 'echo "load1=$(cut -d" " -f1 /proc/loadavg) load5=$(cut -d" " -f2 /proc/loadavg)"'
thresholds.load1 = { warn = "> 8", crit = "> 16" }

[[check]]
name = "http"
use = "fast"
apply_to = '"web" in host.tags'
command = 'echo "HTTP OK: 200 OK - 928 bytes | time=$((RANDOM % 120 + 40))ms size=928B"'
thresholds.time = { warn = "> 500", crit = "> 2s" }

[[check]]
name = "tls_expiry"
use = "fast"
hosts = ["web02"]
command = 'echo "TLS CRITICAL - certificate for shop.example.com expires in 2 days | days_left=2"; exit 2'

[[check]]
name = "replication"
use = "fast"
hosts = ["db01"]
command = 'echo "REPLICATION WARNING - replica lag 45s | lag=$((RANDOM % 10 + 40))s;30;120"; exit 1'

[[check]]
name = "pg_connections"
use = "fast"
hosts = ["db01"]
command = 'echo "connections=$((RANDOM % 40 + 80)) max_connections=200"'

[[check]]
name = "queue_depth"
use = "fast"
hosts = ["mq-01"]
max_attempts = 100
command = 'echo "QUEUE CRITICAL - mail queue depth 812 | depth=812;100;500"; exit 2'

[[check]]
name = "backup"
passive = true
freshness = "26h"
hosts = ["backup01"]

[[check]]
name = "qsysopr_messages"
use = "fast"
hosts = ["as400-prod"]
command = 'echo "UNKNOWN - Mapepire connection refused (10.0.9.5:8076)"; exit 3'

[[check]]
name = "asp_usage"
use = "fast"
hosts = ["as400-prod"]
command = 'echo "ASP OK - system ASP 71% used | asp1=71%;85;90"'
