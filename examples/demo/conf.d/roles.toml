# Services run every few seconds so graphs fill quickly.

# Every host is pinged; the ping gives it UP/DOWN.
[role.server]
hosts = {}
host_check = "ping"
interval = "3s"
retry_interval = "2s"
service.ping = {}

[role.linux]
hosts = { tags = ["linux"] }
interval = "3s"
retry_interval = "2s"
service.load = {}

[role.web]
hosts = { tags = ["web"] }
groups = ["web-servers"]
interval = "3s"
retry_interval = "2s"
service.http = { groups = ["webshop"] }

[role.db]
hosts = { tags = ["db"] }
interval = "3s"
retry_interval = "2s"
service.replication = { groups = ["webshop"] }
service.pg_connections = {}

[role.mq]
hosts = { name = "mq-*" }
interval = "3s"
retry_interval = "2s"
service.queue_depth = {}

[role.ibmi]
hosts = { tags = ["ibmi"] }
interval = "3s"
retry_interval = "2s"
service.qsysopr_messages = {}
service.asp_usage = {}
