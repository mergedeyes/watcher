# cargo-deny: dependency policy, checked in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported for direct dependencies only.
unmaintained = "workspace"

[licenses]
# Everything here is compatible with AGPL-3.0-only (Apache-2.0 is
# compatible with GPLv3-family licenses).
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Not every allowed license is in use on every branch.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
