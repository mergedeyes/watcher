# Databases for development and tests:
#   docker compose up -d --wait
#   export WATCHER_TEST_TIMESCALE_URL=postgres://watcher:watcher@localhost:55432/postgres
#   export WATCHER_TEST_POSTGRES_URL=postgres://watcher:watcher@localhost:55433/postgres
#   cargo test -p watcher-store
services:
  timescale:
    image: timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "watcher"]
      interval: 2s
      timeout: 5s
      retries: 15
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "watcher"]
      interval: 2s
      timeout: 5s
      retries: 15
