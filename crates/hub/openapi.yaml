openapi: 3.1.0
info:
  title: Watcher API
  version: "1"
  description: |
    JSON API of the Watcher hub; the web UI uses only this API.
    Errors are `{"error": "..."}` with a matching status code.
    With a database, login is required: a session cookie (`POST /auth/login`)
    or an API token (`Authorization: Bearer wt_...`). Requests with the
    cookie that change something must come from the same origin.
  license:
    name: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - session: []
  - token: []

paths:
  /health:
    get:
      summary: Status and version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  uptime_s: { type: integer }
                  services: { type: integer }
                  database: { type: [string, "null"], example: TimescaleDB }
                  instance: { type: [string, "null"] }

  /openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200": { description: OpenAPI 3.1 in YAML }

  /hosts:
    get:
      summary: Hosts with their state, filtered, sorted and paged
      parameters:
        - name: state
          in: query
          description: "Comma-separated: up, down, pending"
          schema: { type: string, example: down }
        - { name: group, in: query, description: Hosts in this host group, schema: { type: string } }
        - { name: unhandled, in: query, description: DOWN and neither acknowledged nor in a downtime, schema: { type: boolean } }
        - { name: q, in: query, description: Text in the name, address or host groups (ignoring case), schema: { type: string } }
        - { name: sort, in: query, description: Config order without, schema: { type: string, enum: [host, status, address, last_check, duration] } }
        - { name: desc, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/offset" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts: { $ref: "#/components/schemas/HostCounts", description: Of the hosts that match every filter but state }
                  total: { type: integer, description: Hosts that match every filter }
                  hosts: { type: array, items: { $ref: "#/components/schemas/HostView" }, description: The requested page }
        "400": { $ref: "#/components/responses/Error" }

  /hosts/{host}:
    get:
      summary: One host with its services
      parameters: [{ $ref: "#/components/parameters/host" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/HostView" }
                  services: { type: array, items: { $ref: "#/components/schemas/ServiceView" } }
                  origin: { type: string, description: "file:line" }
        "404": { $ref: "#/components/responses/Error" }

  /services:
    get:
      summary: Services, filtered, sorted and paged
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: hostgroup, in: query, description: Services of hosts in this host group, schema: { type: string } }
        - { name: group, in: query, description: Services in this service group, schema: { type: string } }
        - name: state
          in: query
          description: "Comma-separated: ok, warning, critical, unknown, pending"
          schema: { type: string, example: "warning,critical" }
        - { name: problems, in: query, description: Not OK and not pending, schema: { type: boolean } }
        - { name: hard, in: query, description: Only hard states, schema: { type: boolean } }
        - { name: unhandled, in: query, description: Problems neither acknowledged nor in a downtime, schema: { type: boolean } }
        - { name: q, in: query, description: Text in the host, service, title or output (ignoring case), schema: { type: string } }
        - { name: sort, in: query, description: Config order without, schema: { type: string, enum: [host, service, status, last_check, duration, attempt] } }
        - { name: desc, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/offset" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts: { $ref: "#/components/schemas/Counts", description: Of the services that match every filter but state }
                  total: { type: integer, description: Services that match every filter }
                  services: { type: array, items: { $ref: "#/components/schemas/ServiceView" }, description: The requested page }
        "400": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}:
    get:
      summary: One service with its last result
      parameters: [{ $ref: "#/components/parameters/host" }, { $ref: "#/components/parameters/service" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}/result:
    post:
      summary: Submit a passive result
      description: Give `exit_code` (Nagios semantics) or `state`. `output` is parsed like plugin stdout.
      parameters: [{ $ref: "#/components/parameters/host" }, { $ref: "#/components/parameters/service" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exit_code: { type: integer, example: 0 }
                state: { $ref: "#/components/schemas/State" }
                output: { type: string, example: "BACKUP OK - 12 GB | size=12GB" }
      responses:
        "200":
          description: The service after the result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}/run:
    post:
      summary: Run the service's command once and return the result, without recording it
      parameters:
        - { name: host, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The result, content: { application/json: { schema: { $ref: "#/components/schemas/RunResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /run-check:
    post:
      summary: Run any command as a check, with the check directories in PATH (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string }
                shell: { type: boolean, default: false }
                format: { type: string, enum: [auto, nagios, key_value, json], default: auto }
                timeout: { type: string, default: 60s }
            example: { command: "check_ping -H 10.0.0.5 -w 100,20% -c 500,60%" }
      responses:
        "200": { description: The result, content: { application/json: { schema: { $ref: "#/components/schemas/RunResult" } } } }
        "403": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}/series:
    get:
      summary: Metric series of a service
      parameters: [{ $ref: "#/components/parameters/host" }, { $ref: "#/components/parameters/service" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Series" } }
        "503": { $ref: "#/components/responses/Error" }

  /series/{id}/points:
    get:
      summary: Points of a series, bucketed
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: from, in: query, description: "RFC 3339, unix seconds or a duration back from now (6h); default 1h", schema: { type: string } }
        - { name: to, in: query, description: Like from; default now, schema: { type: string } }
        - { name: points, in: query, description: Max. buckets (1-10000, default 600), schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Points" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /events:
    get:
      summary: Alert history (state changes, host UP/DOWN, flapping), newest first
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: before, in: query, description: For paging, like `from` of points, schema: { type: string } }
        - { name: since, in: query, description: Like `from` of points, schema: { type: string } }
        - { name: type, in: query, description: "Comma-separated: service, host, flapping, ack, downtime", schema: { type: string } }
        - { name: state, in: query, description: "Comma-separated states changed to: ok, warning, critical, unknown, up, down", schema: { type: string } }
        - { name: state_type, in: query, schema: { $ref: "#/components/schemas/StateType" } }
        - { name: hard, in: query, description: Only hard changes, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StateEvent" } }
        "503": { $ref: "#/components/responses/Error" }

  /notifications:
    get:
      summary: The notification log, newest first
      description: |
        One entry per contact and channel: who got which notification, and
        whether it was delivered. Entries are kept for 90 days.
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: service, in: query, description: For host notifications the host check, schema: { type: string } }
        - { name: contact, in: query, schema: { type: string } }
        - { name: host_check, in: query, description: "true: only host notifications; false: only service notifications", schema: { type: boolean } }
        - { name: failed, in: query, description: Only failed deliveries, schema: { type: boolean } }
        - { name: before, in: query, description: For paging, like `from` of points, schema: { type: string } }
        - { name: since, in: query, description: Like `from` of points, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SentNotification" } }
        "503": { $ref: "#/components/responses/Error" }

  /actions/{action}:
    post:
      summary: Act on hosts and services
      description: |
        Actions: `recheck` (run now, also while checks are off), `ack` / `unack`
        (acknowledge a problem; ends when OK), `mute` / `unmute` (notifications),
        `disable-checks` / `enable-checks` (active checks), `downtime` (no
        notifications from `start` to `end` or for `duration`).
        Groups are expanded to their hosts or services; a downtime keeps the
        group, so later members are covered too. A host covers its services;
        acknowledging a host acknowledges its host check problem.
        Any logged-in user.
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [recheck, ack, unack, mute, unmute, disable-checks, enable-checks, downtime] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hosts: { type: array, items: { type: string } }
                services: { type: array, items: { type: string }, description: "host/service ids" }
                hostgroups: { type: array, items: { type: string } }
                servicegroups: { type: array, items: { type: string } }
                downtimegroups: { type: array, items: { type: string } }
                comment: { type: string }
                start: { type: string, description: "Downtime: RFC 3339 or unix seconds; default now" }
                end: { type: string, description: "Downtime: RFC 3339 or unix seconds" }
                duration: { type: string, description: "Downtime: instead of end, e.g. 2h" }
            example: { hosts: [web01], duration: 2h, comment: patching }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  done: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: object, properties: { target: { type: string }, reason: { type: string } } } }
                  downtimes: { type: array, items: { $ref: "#/components/schemas/Downtime" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /flags:
    get:
      summary: Acknowledgements, muted hosts and services, disabled checks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Flag" } }

  /downtimes:
    get:
      summary: Downtimes that haven't ended, and the current or next window of every downtime group
      responses:
        "200":
          description: Active first, then by start
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: [integer, "null"], description: null for downtime group windows }
                    kind: { type: string, enum: [host, service, hostgroup, servicegroup, downtimegroup] }
                    target: { type: string }
                    start: { $ref: "#/components/schemas/Time" }
                    end: { $ref: "#/components/schemas/Time" }
                    author: { type: [string, "null"] }
                    comment: { type: string }
                    window: { type: [string, "null"], description: "Schedule entry, e.g. sun 02:00-04:00" }
                    active: { type: boolean }
                    hosts: { type: integer }
                    services: { type: integer }

  /downtimes/{id}:
    delete:
      summary: End a downtime
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }

  /process:
    get:
      summary: Process info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  instance: { type: [string, "null"] }
                  started: { $ref: "#/components/schemas/Time" }
                  uptime_s: { type: integer }
                  config_loaded: { $ref: "#/components/schemas/Time" }
                  database: { type: [string, "null"] }
                  notifications: { type: boolean }
                  checks: { type: boolean, description: Active checks }
                  hosts: { type: integer }
                  services: { type: integer }
                  scheduler: { type: object, properties: { jobs: { type: integer }, running: { type: integer }, paused: { type: integer }, passive: { type: integer } } }
                  results: { type: object, description: Check results, properties: { last_1m: { type: integer }, last_5m: { type: integer }, last_15m: { type: integer } } }
                  acknowledged: { type: integer }
                  muted: { type: integer }
                  checks_off: { type: integer }
                  in_downtime: { type: integer, description: Services }
    put:
      summary: Turn notifications or active checks on or off (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notifications: { type: boolean }
                checks: { type: boolean }
      responses:
        "200": { description: The switches now }
        "403": { $ref: "#/components/responses/Error" }

  /scheduler:
    get:
      summary: Scheduling queue, soonest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    host: { type: string }
                    service: { type: string }
                    title: { type: [string, "null"] }
                    next_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
                    last_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
                    running: { type: boolean }
                    passive: { type: boolean }
                    paused: { type: boolean }
                    interval_s: { type: number }

  /groups:
    get:
      summary: Host and service groups with status totals (members are in the host and service views)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostgroups:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/Group" }
                        - type: object
                          properties:
                            hosts: { $ref: "#/components/schemas/HostCounts" }
                            services: { $ref: "#/components/schemas/Counts" }
                  servicegroups:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/Group" }
                        - type: object
                          properties:
                            services: { $ref: "#/components/schemas/Counts" }
                  downtimegroups: { type: array, items: { type: object, properties: { name: { type: string }, title: { type: [string, "null"] }, schedule: { type: array, items: { type: string } } } } }

  /summary:
    get:
      summary: Host and service totals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }

  /names:
    get:
      summary: All host names and the distinct service names, for suggestions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts: { type: array, items: { type: string } }
                  services: { type: array, items: { type: string } }

  /stream:
    get:
      summary: Live updates (Server-Sent Events)
      description: |
        Events: `result` (a ServiceView after a check), `summary` (a Summary
        when states, flags or the config changed, at most once a second, and
        when the stream opens), `reload` (the config was reloaded or a command
        changed something; fetch again), `lagged` (updates were dropped; fetch
        again).

        With `watch=true` the stream first sends `hello` with its `id`, and
        `result` only for the services and hosts set with `PUT /stream/{id}`:
        the rows a page shows. Lists showing a page fetch it again when the
        summary's `generation` changes.
      parameters:
        - { name: watch, in: query, description: Only results set with PUT /stream/{id}, schema: { type: boolean } }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream: {}

  /stream/{id}:
    put:
      summary: What a stream opened with watch=true gets results of
      description: Replaces the previous set. At most 10000 entries.
      parameters: [{ name: id, in: path, required: true, description: From the stream's hello event, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services: { type: array, items: { type: string }, description: "host/service ids" }
                hosts: { type: array, items: { type: string }, description: All services of these hosts }
      responses:
        "200": { description: How many services and hosts are watched }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/status:
    get:
      summary: Whether login is needed, and who is logged in
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  required: { type: boolean }
                  user: { oneOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }] }
                  users_exist: { type: boolean }

  /auth/login:
    post:
      summary: Log in; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                code:
                  type: string
                  description: >
                    For users with two-factor authentication: the six-digit
                    code from their app, or one of their recovery codes.
                    Each code works once.
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: >
            Wrong username or password; or the password was right and
            `totp_required` asks for a (valid) `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  totp_required: { type: boolean }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      summary: End the session
      responses:
        "204": { description: Logged out }

  /auth/totp:
    get:
      summary: The current user's two-factor authentication
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  recovery_codes: { type: integer, description: Recovery codes left }
    put:
      summary: Turn on two-factor authentication
      description: >
        Takes the secret from `POST /auth/totp/setup` and a code the app
        made from it, which shows the app is set up right. The secret is
        stored sealed with `secret.key`. Returns ten recovery codes, shown
        only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string, description: Base32 }
                code: { type: string, example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Turn off two-factor authentication
      description: Needs a code from the app or a recovery code.
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "204": { description: Turned off }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/totp/setup:
    post:
      summary: A new secret for an authenticator app
      description: >
        Nothing is stored yet: `PUT /auth/totp` with a code turns
        two-factor on. The issuer in `uri` is `instance_name`, or Watcher.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "Base32, to type into the app" }
                  uri: { type: string, example: "otpauth://totp/Watcher:alice?secret=...&issuer=Watcher&algorithm=SHA1&digits=6&period=30" }
                  qr: { type: string, description: "`uri` as a QR code, an SVG image" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /auth/totp/recovery:
    post:
      summary: New recovery codes
      description: >
        Needs a code from the app or a recovery code. The old recovery
        codes stop working.
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /tokens:
    get:
      summary: The current user's API tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    post:
      summary: Create an API token (shown only in this response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: backup cron job }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: wt_... }
                  info: { $ref: "#/components/schemas/ApiToken" }
        "409": { $ref: "#/components/responses/Error" }

  /tokens/{id}:
    delete:
      summary: Revoke an API token
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /users:
    get:
      summary: User accounts (admins)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a user (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 10 }
                admin: { type: boolean, default: false }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /users/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    put:
      summary: Change a user (admins), or your own password
      description: A new password or disabling ends the user's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 10 }
                admin: { type: boolean }
                disabled: { type: boolean }
                totp:
                  type: boolean
                  description: >
                    `false` turns two-factor authentication off, for a user
                    who lost their device. Users turn it on themselves
                    (`PUT /auth/totp`).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a user with their sessions and tokens (admins; not yourself)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /ssh/secrets:
    get:
      summary: Secrets for checks over SSH, without their values (admins)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Secret" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Generate or store a key, or store a password (admins)
      description: >
        Stored sealed with `secret.key` in the data directory (created on
        first use). `generate` makes an ed25519 key: put `public_key` into
        the target's `authorized_keys`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, description: "As in ssh = { secret = ... }" }
                kind: { type: string, enum: [generate, key, password] }
                private_key: { type: string, description: "kind key: ed25519 or ECDSA; OpenSSH, PEM or PuTTY" }
                passphrase: { type: string, description: "kind key, if encrypted" }
                password: { type: string, description: kind password }
                replace: { type: boolean, default: false }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Secret" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /ssh/secrets/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Delete a secret (admins)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /ssh/hostkeys:
    get:
      summary: Pinned host keys, and changed keys waiting for acceptance (admins)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HostKey" } } } } }
        "403": { $ref: "#/components/responses/Error" }

  /ssh/hostkeys/{address}/{port}:
    parameters:
      - { name: address, in: path, required: true, schema: { type: string } }
      - { name: port, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Forget a host key; the next one is pinned (admins)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /ssh/hostkeys/{address}/{port}/accept:
    parameters:
      - { name: address, in: path, required: true, schema: { type: string } }
      - { name: port, in: path, required: true, schema: { type: integer } }
    post:
      summary: Pin the changed key the host presented (admins)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HostKey" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /config:
    get:
      summary: Config mode, object files and problems on disk (admins)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [hybrid, files, ui] }
                  writable: { type: boolean }
                  dir: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        hash: { type: string }
                        size: { type: integer }
                  locks: { type: array, items: { $ref: "#/components/schemas/Lock" } }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "403": { $ref: "#/components/responses/Error" }

  /config/files/{path}:
    get:
      summary: One object file (admins)
      parameters: [{ name: path, in: path, required: true, description: "Relative, e.g. ui/hosts.toml", schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFile" }
        "404": { $ref: "#/components/responses/Error" }

  /config/objects:
    get:
      summary: All objects as written (admins)
      parameters:
        - { name: kind, in: query, description: Only this kind, schema: { $ref: "#/components/schemas/Kind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects: { type: array, items: { $ref: "#/components/schemas/ConfigObject" } }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }

  /config/objects/{kind}/{name}:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/Kind" } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      summary: One object as written, with file and line (admins)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConfigObject" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Create or replace an object and apply it (admins)
      description: |
        One step instead of edit + apply. The body is the object's fields as
        written; `name` comes from the path. Existing objects are edited where
        they are (comments kept); new ones go to `path` or the kind's UI file.
        Responses as for `config/apply` (422 with diagnostics when invalid;
        nothing is written then).
      parameters:
        - { name: path, in: query, description: "New objects: file, e.g. hosts/web.toml", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example: { address: 10.0.0.7, groups: [linux], services: [http] }
        - { $ref: "#/components/parameters/lease" }
      responses:
        "200": { description: Applied; changes and warnings }
        "422": { description: Invalid; diagnostics }
        "423": { $ref: "#/components/responses/Locked" }
    delete:
      summary: Delete an object and apply it (admins)
      parameters: [{ $ref: "#/components/parameters/lease" }]
      responses:
        "200": { description: Applied; changes and warnings }
        "404": { $ref: "#/components/responses/Error" }
        "422": { description: Invalid (something still uses it); diagnostics }
        "423": { $ref: "#/components/responses/Locked" }

  /config/match:
    post:
      summary: What selectors match in the running config, with why (admins)
      description: For previews. Host group and downtime group member lists are host selectors (lists of names and patterns).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, selectors]
              properties:
                kind: { type: string, enum: [host, service] }
                selectors: { type: array, items: {}, description: "Selectors; a match of any counts" }
            example: { kind: host, selectors: [{ groups: [linux], exclude: { name: "lab*" } }] }
      responses:
        "200":
          description: Matches (first 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  matches: { type: array, items: { type: object, properties: { name: { type: string }, why: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }

  /config/reload:
    post:
      summary: Read the object files again (admins)
      responses:
        "200": { description: Reloaded }
        "400": { $ref: "#/components/responses/Error" }

  /config/tree/{kind}/{name}:
    get:
      summary: Config Tree of an object in the running config (admins)
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [host, service, check, hostgroup, servicegroup, contact, contactgroup, downtimegroup, timeperiod, notify, dependency] } }
        - { name: name, in: path, required: true, description: "host/service for services", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeNode" }
        "404": { $ref: "#/components/responses/Error" }

  /config/scripts:
    get:
      summary: Check directories and the executables in them (admins)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dirs: { type: array, items: { type: string } }
                  scripts:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        dir: { type: string }

  /config/edit:
    post:
      summary: The file change for creating, updating or deleting an object (admins)
      description: Writes nothing; pass the result to preview or apply. No `name` creates; no `fields` deletes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Edit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Change" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /config/edit-many:
    post:
      summary: File changes for several objects at once, e.g. clones (admins)
      description: Edits are applied in order; edits of the same file build on each other. One change per file. Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edits]
              properties:
                edits: { type: array, minItems: 1, maxItems: 1000, items: { $ref: "#/components/schemas/Edit" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /config/preview:
    post:
      summary: Validate changes and show their effect (admins)
      requestBody: { $ref: "#/components/requestBodies/Changes" }
      responses:
        "200":
          description: Valid or not, with diagnostics and effective changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  changes: { $ref: "#/components/schemas/Changes" }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "409": { $ref: "#/components/responses/Conflict" }

  /config/apply:
    post:
      summary: Write changes and reload (admins)
      parameters: [{ $ref: "#/components/parameters/lease" }]
      requestBody: { $ref: "#/components/requestBodies/Changes" }
      responses:
        "200":
          description: Written and reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { $ref: "#/components/schemas/Changes" }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The config would have errors; nothing written
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "423": { $ref: "#/components/responses/Locked" }

  /config/locks:
    get:
      summary: Who is editing which object file (admins)
      description: |
        Edit leases from the web UI and API clients, `watcher config edit`,
        and editors that leave a lock file next to the file (vim, nano with
        `set locking`, emacs, Kate). Lock files of processes that are gone
        are left out.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  locks: { type: array, items: { $ref: "#/components/schemas/Lock" } }

  /config/locks/{path}:
    parameters:
      - { name: path, in: path, required: true, description: "Relative, e.g. ui/hosts.toml", schema: { type: string } }
    put:
      summary: Take or renew the edit lease on a file (admins)
      description: |
        While you hold the lease, other clients cannot write the file
        (`config/apply` and the object endpoints give 423). Renew it every
        30 seconds with `lease`; it lapses 2 minutes after the last renewal.
        Send held leases in the `X-Watcher-Lease` header when writing. A
        file open in an editor needs a lease to be written: take it with
        `force`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lease: { type: string, description: The lease to renew; omit to take a new one }
                force: { type: boolean, default: false, description: Take the file over from whoever is editing it }
            example: {}
      responses:
        "200":
          description: Lease taken or renewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  lease: { type: string }
                  path: { type: string }
                  others: { type: array, items: { $ref: "#/components/schemas/Lock" }, description: Editors that have the file open as well }
        "423": { $ref: "#/components/responses/Locked" }
    delete:
      summary: Give up an edit lease (admins)
      parameters:
        - { name: lease, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Released }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: watcher_session }
    token: { type: http, scheme: bearer, description: "API token, wt_..." }

  parameters:
    host: { name: host, in: path, required: true, schema: { type: string } }
    service: { name: service, in: path, required: true, schema: { type: string } }
    offset: { name: offset, in: query, description: Rows to skip, schema: { type: integer, default: 0 } }
    limit: { name: limit, in: query, description: Rows to return; all without, schema: { type: integer } }
    lease: { name: X-Watcher-Lease, in: header, description: "Edit leases held, comma-separated (config/locks)", schema: { type: string } }

  requestBodies:
    Code:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, description: A code from the app, or a recovery code }
    Changes:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              changes: { type: array, items: { $ref: "#/components/schemas/Change" } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecoveryCodes:
      description: New recovery codes, shown only now
      content:
        application/json:
          schema:
            type: object
            properties:
              recovery_codes: { type: array, items: { type: string, example: k7mqa-x3vbn } }
    Conflict:
      description: A file changed since it was read
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              path: { type: string }
              current: { oneOf: [{ $ref: "#/components/schemas/ConfigFile" }, { type: "null" }] }
    Locked:
      description: Someone else is editing the file
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "anna is editing hosts.toml in vim" }
              holder: { $ref: "#/components/schemas/Lock" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    State: { type: string, enum: [ok, warning, critical, unknown] }
    HostState: { type: string, enum: [up, down] }
    StateType: { type: string, enum: [soft, hard] }
    Time: { type: string, format: date-time }
    Lock:
      type: object
      properties:
        path: { type: string, description: Relative to the object directory }
        by: { type: string, description: User name; empty if the lock file doesn't say }
        via: { type: string, enum: [web, cli, vim, nano, emacs, kate] }
        since: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        pid: { type: [integer, "null"] }
        host: { type: [string, "null"] }
    Counts:
      type: object
      properties:
        ok: { type: integer }
        warning: { type: integer }
        critical: { type: integer }
        unknown: { type: integer }
        pending: { type: integer }
    HostCounts:
      type: object
      properties:
        up: { type: integer }
        down: { type: integer }
        pending: { type: integer }
    Summary:
      type: object
      properties:
        generation: { type: integer, description: Changes when states, flags or the config change }
        hosts:
          allOf:
            - { $ref: "#/components/schemas/HostCounts" }
            - type: object
              properties:
                total: { type: integer }
                unhandled: { type: integer, description: DOWN, not acknowledged, not in a downtime }
        services:
          allOf:
            - { $ref: "#/components/schemas/Counts" }
            - type: object
              properties:
                total: { type: integer }
                unhandled: { type: integer, description: Not OK, not acknowledged, not in a downtime }
    ServiceView:
      type: object
      properties:
        host: { type: string }
        service: { type: string }
        state: { oneOf: [{ $ref: "#/components/schemas/State" }, { type: "null" }], description: null while pending }
        state_type: { oneOf: [{ $ref: "#/components/schemas/StateType" }, { type: "null" }] }
        attempt: { type: [integer, "null"] }
        max_attempts: { type: integer }
        last_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        last_change: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        output: { type: string }
        passive: { type: boolean }
        graphs: { type: boolean, description: Show graphs of its metrics }
        flapping: { type: boolean }
        groups: { type: array, items: { type: string }, description: Service groups }
        acknowledged: { type: boolean }
        muted: { type: boolean, description: Notifications off for it or its host }
        checks_enabled: { type: boolean }
        downtime: { type: boolean, description: In a downtime now }
    Flag:
      type: object
      properties:
        kind: { type: string, enum: [ack, mute, no_checks] }
        target: { type: string, description: "Host or host/service" }
        author: { type: string }
        comment: { type: string }
        created: { $ref: "#/components/schemas/Time" }
    Downtime:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        target: { type: string }
        starts: { $ref: "#/components/schemas/Time" }
        ends: { $ref: "#/components/schemas/Time" }
        author: { type: string }
        comment: { type: string }
        created: { $ref: "#/components/schemas/Time" }
    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/ServiceView"
        - type: object
          properties:
            last_hard_change: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
            long_output: { type: string }
            duration_ms: { type: [number, "null"] }
            metrics: { type: array, items: { $ref: "#/components/schemas/Metric" } }
            percent_change: { type: [number, "null"], description: Weighted state changes in the last 21 results, 0-100 }
            host_check: { type: boolean }
            check:
              type: object
              properties:
                name: { type: [string, "null"], description: "The check it runs; null for an inline command" }
                service: { type: [string, "null"], description: "The service object it is made from (for for_each services the one they were made from); null for a host's one-off service" }
                assigned: { type: array, items: { type: string }, description: "Why the host has it, e.g. hostgroup linux, servicegroup basics on host web01" }
                command: { type: [string, "null"] }
                interval_s: { type: number }
                retry_interval_s: { type: number }
                timeout_s: { type: number }
                freshness_s: { type: [number, "null"] }
                flap_low: { type: [number, "null"] }
                flap_high: { type: [number, "null"] }
                origin: { type: string, description: "file:line of the service or host service" }
            downtimes: { type: array, items: { type: string }, description: "Downtimes it is in, e.g. hostgroup linux" }
            flags: { type: array, items: { $ref: "#/components/schemas/Flag" }, description: Set on it or its host }
    Metric:
      type: object
      properties:
        name: { type: string }
        value: { type: number }
        unit: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        warn: { type: string, description: Evaluated warning threshold }
        crit: { type: string, description: Evaluated critical threshold }
        perf_warn: { type: string, description: Warning threshold from the plugin output }
        perf_crit: { type: string, description: Critical threshold from the plugin output }
        min: { type: number }
        max: { type: number }
        state: { $ref: "#/components/schemas/State" }
    HostView:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        node: { type: [string, "null"] }
        ssh:
          description: For run_on = "host" services
          oneOf:
            - type: object
              properties: { user: { type: string }, port: { type: integer }, secret: { type: string } }
            - type: "null"
        vars: { type: object, description: "Values are strings, or objects (for_each data)" }
        groups: { type: array, items: { type: string }, description: Host groups }
        enabled: { type: boolean }
        state: { oneOf: [{ $ref: "#/components/schemas/HostState" }, { type: "null" }], description: "From the host check; up without one; null while pending" }
        state_type: { oneOf: [{ $ref: "#/components/schemas/StateType" }, { type: "null" }] }
        attempt: { type: [integer, "null"] }
        max_attempts: { type: [integer, "null"] }
        last_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        last_change: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        output: { type: string }
        flapping: { type: boolean }
        check: { type: [string, "null"], description: Host check name }
        graph: { type: [string, "null"], description: "Service whose graphs the host page shows: `graph` of the host, or the host check" }
        worst: { oneOf: [{ $ref: "#/components/schemas/State" }, { type: "null" }], description: Worst service state }
        services: { $ref: "#/components/schemas/Counts" }
        acknowledged: { type: boolean, description: The host problem is acknowledged }
        muted: { type: boolean }
        checks_enabled: { type: boolean }
        downtime: { type: boolean }
    Series:
      type: object
      properties:
        id: { type: integer }
        metric: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        unit: { type: string }
        first: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        last: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
    Points:
      type: object
      properties:
        bucket: { type: number, description: Bucket width in seconds }
        points:
          type: array
          description: "[unix ms, avg, min, max, count]"
          items: { type: array, items: { type: number }, minItems: 5, maxItems: 5 }
    StateEvent:
      type: object
      properties:
        host: { type: string }
        service: { type: string }
        ts: { $ref: "#/components/schemas/Time" }
        kind: { type: string, enum: [service, host, flap_start, flap_stop], description: "host: UP/DOWN of the host, from its host check" }
        from_state: { type: [string, "null"], description: "A State, or up/down for host events; null for the first result and flapping" }
        to_state: { type: string, description: "A State, or up/down for host events" }
        state_type: { $ref: "#/components/schemas/StateType" }
        hard: { type: boolean }
        output: { type: string }
        title: { type: [string, "null"], description: The service's title now }
    SentNotification:
      type: object
      properties:
        ts: { $ref: "#/components/schemas/Time" }
        host: { type: string }
        service: { type: string, description: For host notifications the host check }
        host_check: { type: boolean }
        kind: { type: string, enum: [problem, recovery, flappingstart, flappingstop, downtimestart, downtimeend] }
        state: { type: string, description: "ok, warning, critical, unknown, up or down" }
        repeat: { type: boolean, description: "A problem sent again: a repeat or an escalation" }
        since: { type: [string, "null"], format: date-time, description: "Problems: when it reached its state" }
        contact: { type: string }
        channel: { type: string, description: "email, webhook, slack, teams, telegram, ntfy, gotify, pagerduty, jira or script; empty if the contact has none" }
        error: { type: [string, "null"], description: "null: delivered" }
    RunResult:
      type: object
      properties:
        command: { type: string }
        state: { $ref: "#/components/schemas/State" }
        plugin_state: { $ref: "#/components/schemas/State" }
        message: { type: string }
        long_output: { type: string }
        format: { type: [string, "null"] }
        metrics: { type: array, items: { $ref: "#/components/schemas/Metric" } }
        stdout: { type: string }
        stderr: { type: string }
        termination: { type: string }
        duration_ms: { type: number }
    Secret:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [key, password] }
        public_key: { type: [string, "null"], description: For authorized_keys }
        fingerprint: { type: [string, "null"], example: "SHA256:..." }
        hosts: { type: array, items: { type: string }, description: Hosts that use it }
        created: { $ref: "#/components/schemas/Time" }
        updated: { $ref: "#/components/schemas/Time" }
    HostKey:
      type: object
      properties:
        address: { type: string }
        port: { type: integer }
        key: { type: string }
        fingerprint: { type: string }
        pinned: { $ref: "#/components/schemas/Time" }
        offered: { type: [string, "null"], description: A different key the host presented }
        offered_fingerprint: { type: [string, "null"] }
        offered_at: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        hosts: { type: array, items: { type: string } }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        admin: { type: boolean }
        disabled: { type: boolean }
        created: { $ref: "#/components/schemas/Time" }
        last_login: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        totp: { type: boolean, description: Two-factor authentication is on }
    ApiToken:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created: { $ref: "#/components/schemas/Time" }
        last_used: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
    Problem:
      type: object
      properties:
        path: { type: [string, "null"] }
        line: { type: integer }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
    ConfigFile:
      type: object
      properties:
        path: { type: string }
        hash: { type: string, description: SHA-256 }
        text: { type: string }
    Kind: { type: string, enum: [check, service, host, hostgroup, servicegroup, contact, contactgroup, downtimegroup, timeperiod, notify, dependency, sink] }
    ConfigObject:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        name: { type: string }
        path: { type: string }
        line: { type: integer }
        fields: { type: object }
    Edit:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        name: { type: [string, "null"], description: The object to change; null creates one }
        fields: { type: [object, "null"], description: The fields as written, with name; null deletes, example: { name: web01, address: 10.0.0.5, groups: [linux] } }
        path: { type: [string, "null"], description: "New objects: the file, relative to the object directory (default: the kind's ui/ file)" }
    Change:
      type: object
      required: [path]
      properties:
        path: { type: string }
        base: { type: [string, "null"], description: Hash the change was made on; null creates the file }
        text: { type: [string, "null"], description: New text; null deletes the file }
    Delta:
      type: object
      properties:
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
    Changes:
      type: object
      properties:
        hosts: { $ref: "#/components/schemas/Delta" }
        services: { $ref: "#/components/schemas/Delta" }
        groups: { $ref: "#/components/schemas/Delta", description: "As `hostgroup x`, `servicegroup x`, `contactgroup x`" }
        contacts: { $ref: "#/components/schemas/Delta" }
        notify: { $ref: "#/components/schemas/Delta", description: Notify rules by name or place }
        dependencies: { $ref: "#/components/schemas/Delta", description: Dependencies by name or place }
        sinks: { $ref: "#/components/schemas/Delta" }
    Group:
      type: object
      properties:
        name: { type: string }
        title: { type: [string, "null"] }
    TreeNode:
      type: object
      properties:
        kind: { type: string, description: "host, service (host/service: on a host, otherwise a service object), check, hostgroup, servicegroup, contact, contactgroup, downtimegroup, timeperiod, notify, dependency; section or value otherwise" }
        name: { type: string, description: "Object name to link to (host/service for services)" }
        label: { type: string }
        detail: { type: string, description: A value, or why something applies }
        file: { type: string, description: Relative to the object directory }
        line: { type: integer }
        children: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }
