openapi: 3.1.0
info:
  title: Watcher API
  version: "1"
  description: |
    JSON API of the Watcher hub; the web UI uses only this API.
    Errors are `{"error": "..."}` with a matching status code.
    With a database, login is required: a session cookie (`POST /auth/login`)
    or an API token (`Authorization: Bearer wt_...`). Requests with the
    cookie that change something must come from the same origin.
  license:
    name: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - session: []
  - token: []

paths:
  /health:
    get:
      summary: Status and version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  uptime_s: { type: integer }
                  services: { type: integer }
                  database: { type: [string, "null"], example: TimescaleDB }
                  instance: { type: [string, "null"] }

  /openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200": { description: OpenAPI 3.1 in YAML }

  /hosts:
    get:
      summary: All hosts with their state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/HostView" } }

  /hosts/{host}:
    get:
      summary: One host with its services
      parameters: [{ $ref: "#/components/parameters/host" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/HostView" }
                  services: { type: array, items: { $ref: "#/components/schemas/ServiceView" } }
                  origin: { type: string, description: "file:line" }
        "404": { $ref: "#/components/responses/Error" }

  /services:
    get:
      summary: Services, filtered
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - name: state
          in: query
          description: Comma-separated
          schema: { type: string, example: "warning,critical" }
        - { name: problems, in: query, description: Not OK and not pending, schema: { type: boolean } }
        - { name: hard, in: query, description: Only hard states, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts: { $ref: "#/components/schemas/Counts" }
                  services: { type: array, items: { $ref: "#/components/schemas/ServiceView" } }
        "400": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}:
    get:
      summary: One service with its last result
      parameters: [{ $ref: "#/components/parameters/host" }, { $ref: "#/components/parameters/service" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}/result:
    post:
      summary: Submit a passive result
      description: Give `exit_code` (Nagios semantics) or `state`. `output` is parsed like plugin stdout.
      parameters: [{ $ref: "#/components/parameters/host" }, { $ref: "#/components/parameters/service" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exit_code: { type: integer, example: 0 }
                state: { $ref: "#/components/schemas/State" }
                output: { type: string, example: "BACKUP OK - 12 GB | size=12GB" }
      responses:
        "200":
          description: The service after the result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /services/{host}/{service}/series:
    get:
      summary: Metric series of a service
      parameters: [{ $ref: "#/components/parameters/host" }, { $ref: "#/components/parameters/service" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Series" } }
        "503": { $ref: "#/components/responses/Error" }

  /series/{id}/points:
    get:
      summary: Points of a series, bucketed
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: from, in: query, description: "RFC 3339, unix seconds or a duration back from now (6h); default 1h", schema: { type: string } }
        - { name: to, in: query, description: Like from; default now, schema: { type: string } }
        - { name: points, in: query, description: Max. buckets (1-10000, default 600), schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Points" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /events:
    get:
      summary: Alert history (state changes, host UP/DOWN, flapping), newest first
      parameters:
        - { name: host, in: query, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: before, in: query, description: For paging, like `from` of points, schema: { type: string } }
        - { name: since, in: query, description: Like `from` of points, schema: { type: string } }
        - { name: type, in: query, description: "Comma-separated: service, host, flapping", schema: { type: string } }
        - { name: state, in: query, description: "Comma-separated states changed to: ok, warning, critical, unknown, up, down", schema: { type: string } }
        - { name: state_type, in: query, schema: { $ref: "#/components/schemas/StateType" } }
        - { name: hard, in: query, description: Only hard changes, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StateEvent" } }
        "503": { $ref: "#/components/responses/Error" }

  /actions/{action}:
    post:
      summary: Act on hosts and services
      description: |
        Actions: `recheck` (run now, also while checks are off), `ack` / `unack`
        (acknowledge a problem; ends when OK), `mute` / `unmute` (notifications),
        `disable-checks` / `enable-checks` (active checks), `downtime` (no
        notifications from `start` to `end` or for `duration`).
        Groups are expanded to their hosts or services; a downtime keeps the
        group, so later members are covered too. A host covers its services;
        acknowledging a host acknowledges its host check problem.
        Any logged-in user.
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [recheck, ack, unack, mute, unmute, disable-checks, enable-checks, downtime] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hosts: { type: array, items: { type: string } }
                services: { type: array, items: { type: string }, description: "host/service ids" }
                hostgroups: { type: array, items: { type: string } }
                servicegroups: { type: array, items: { type: string } }
                downtimegroups: { type: array, items: { type: string } }
                comment: { type: string }
                start: { type: string, description: "Downtime: RFC 3339 or unix seconds; default now" }
                end: { type: string, description: "Downtime: RFC 3339 or unix seconds" }
                duration: { type: string, description: "Downtime: instead of end, e.g. 2h" }
            example: { hosts: [web01], duration: 2h, comment: patching }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  done: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: object, properties: { target: { type: string }, reason: { type: string } } } }
                  downtimes: { type: array, items: { $ref: "#/components/schemas/Downtime" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /flags:
    get:
      summary: Acknowledgements, muted hosts and services, disabled checks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Flag" } }

  /downtimes:
    get:
      summary: Downtimes that haven't ended, and the current or next window of every downtime group
      responses:
        "200":
          description: Active first, then by start
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: [integer, "null"], description: null for downtime group windows }
                    kind: { type: string, enum: [host, service, hostgroup, servicegroup, downtimegroup] }
                    target: { type: string }
                    start: { $ref: "#/components/schemas/Time" }
                    end: { $ref: "#/components/schemas/Time" }
                    author: { type: [string, "null"] }
                    comment: { type: string }
                    window: { type: [string, "null"], description: "Schedule entry, e.g. sun 02:00-04:00" }
                    active: { type: boolean }
                    hosts: { type: integer }
                    services: { type: integer }

  /downtimes/{id}:
    delete:
      summary: End a downtime
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }

  /process:
    get:
      summary: Process info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  pid: { type: integer }
                  instance: { type: [string, "null"] }
                  started: { $ref: "#/components/schemas/Time" }
                  uptime_s: { type: integer }
                  config_loaded: { $ref: "#/components/schemas/Time" }
                  database: { type: [string, "null"] }
                  notifications: { type: boolean }
                  checks: { type: boolean, description: Active checks }
                  hosts: { type: integer }
                  services: { type: integer }
                  scheduler: { type: object, properties: { jobs: { type: integer }, running: { type: integer }, paused: { type: integer }, passive: { type: integer } } }
                  results: { type: object, description: Check results, properties: { last_1m: { type: integer }, last_5m: { type: integer }, last_15m: { type: integer } } }
                  acknowledged: { type: integer }
                  muted: { type: integer }
                  checks_off: { type: integer }
                  in_downtime: { type: integer, description: Services }
    put:
      summary: Turn notifications or active checks on or off (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notifications: { type: boolean }
                checks: { type: boolean }
      responses:
        "200": { description: The switches now }
        "403": { $ref: "#/components/responses/Error" }

  /scheduler:
    get:
      summary: Scheduling queue, soonest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    host: { type: string }
                    service: { type: string }
                    next_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
                    last_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
                    running: { type: boolean }
                    passive: { type: boolean }
                    paused: { type: boolean }
                    interval_s: { type: number }

  /groups:
    get:
      summary: Host and service groups (members are in the host and service views)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostgroups: { type: array, items: { $ref: "#/components/schemas/Group" } }
                  servicegroups: { type: array, items: { $ref: "#/components/schemas/Group" } }
                  downtimegroups: { type: array, items: { type: object, properties: { name: { type: string }, title: { type: [string, "null"] }, schedule: { type: array, items: { type: string } } } } }

  /stream:
    get:
      summary: Live updates (Server-Sent Events)
      description: |
        Events: `result` (a ServiceView after every check), `reload` (the config
        was reloaded; fetch lists again), `lagged` (updates were dropped; fetch again).
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream: {}

  /auth/status:
    get:
      summary: Whether login is needed, and who is logged in
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  required: { type: boolean }
                  user: { oneOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }] }
                  users_exist: { type: boolean }

  /auth/login:
    post:
      summary: Log in; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      summary: End the session
      responses:
        "204": { description: Logged out }

  /tokens:
    get:
      summary: The current user's API tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
    post:
      summary: Create an API token (shown only in this response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: backup cron job }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: wt_... }
                  info: { $ref: "#/components/schemas/ApiToken" }
        "409": { $ref: "#/components/responses/Error" }

  /tokens/{id}:
    delete:
      summary: Revoke an API token
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /config:
    get:
      summary: Config mode, object files and problems on disk (admins)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [hybrid, files, ui] }
                  writable: { type: boolean }
                  dir: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        hash: { type: string }
                        size: { type: integer }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "403": { $ref: "#/components/responses/Error" }

  /config/files/{path}:
    get:
      summary: One object file (admins)
      parameters: [{ name: path, in: path, required: true, description: "Relative, e.g. ui/hosts.toml", schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigFile" }
        "404": { $ref: "#/components/responses/Error" }

  /config/objects:
    get:
      summary: All objects as written, before templates (admins)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects: { type: array, items: { $ref: "#/components/schemas/ConfigObject" } }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }

  /config/tree/{kind}/{name}:
    get:
      summary: Config Tree of an object in the running config (admins)
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [host, service, check, hostgroup, servicegroup, contact, contactgroup, notify] } }
        - { name: name, in: path, required: true, description: "host/service for services", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeNode" }
        "404": { $ref: "#/components/responses/Error" }

  /config/scripts:
    get:
      summary: Check directories and the executables in them (admins)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dirs: { type: array, items: { type: string } }
                  scripts:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        dir: { type: string }

  /config/edit:
    post:
      summary: The file change for creating, updating or deleting an object (admins)
      description: Writes nothing; pass the result to preview or apply. No `name` creates; no `fields` deletes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Edit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Change" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /config/edit-many:
    post:
      summary: File changes for several objects at once, e.g. clones (admins)
      description: Edits are applied in order; edits of the same file build on each other. One change per file. Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edits]
              properties:
                edits: { type: array, minItems: 1, maxItems: 1000, items: { $ref: "#/components/schemas/Edit" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /config/preview:
    post:
      summary: Validate changes and show their effect (admins)
      requestBody: { $ref: "#/components/requestBodies/Changes" }
      responses:
        "200":
          description: Valid or not, with diagnostics and effective changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  changes: { $ref: "#/components/schemas/Changes" }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "409": { $ref: "#/components/responses/Conflict" }

  /config/apply:
    post:
      summary: Write changes and reload (admins)
      requestBody: { $ref: "#/components/requestBodies/Changes" }
      responses:
        "200":
          description: Written and reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { $ref: "#/components/schemas/Changes" }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The config would have errors; nothing written
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  diagnostics: { type: array, items: { $ref: "#/components/schemas/Problem" } }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: watcher_session }
    token: { type: http, scheme: bearer, description: "API token, wt_..." }

  parameters:
    host: { name: host, in: path, required: true, schema: { type: string } }
    service: { name: service, in: path, required: true, schema: { type: string } }

  requestBodies:
    Changes:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              changes: { type: array, items: { $ref: "#/components/schemas/Change" } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: A file changed since it was read
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              path: { type: string }
              current: { oneOf: [{ $ref: "#/components/schemas/ConfigFile" }, { type: "null" }] }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    State: { type: string, enum: [ok, warning, critical, unknown] }
    HostState: { type: string, enum: [up, down] }
    StateType: { type: string, enum: [soft, hard] }
    Time: { type: string, format: date-time }
    Counts:
      type: object
      properties:
        ok: { type: integer }
        warning: { type: integer }
        critical: { type: integer }
        unknown: { type: integer }
        pending: { type: integer }
    ServiceView:
      type: object
      properties:
        host: { type: string }
        service: { type: string }
        state: { oneOf: [{ $ref: "#/components/schemas/State" }, { type: "null" }], description: null while pending }
        state_type: { oneOf: [{ $ref: "#/components/schemas/StateType" }, { type: "null" }] }
        attempt: { type: [integer, "null"] }
        max_attempts: { type: integer }
        last_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        last_change: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        output: { type: string }
        passive: { type: boolean }
        graphs: { type: boolean, description: Show graphs of its metrics }
        flapping: { type: boolean }
        groups: { type: array, items: { type: string }, description: Service groups }
        acknowledged: { type: boolean }
        muted: { type: boolean, description: Notifications off for it or its host }
        checks_enabled: { type: boolean }
        downtime: { type: boolean, description: In a downtime now }
    Flag:
      type: object
      properties:
        kind: { type: string, enum: [ack, mute, no_checks] }
        target: { type: string, description: "Host or host/service" }
        author: { type: string }
        comment: { type: string }
        created: { $ref: "#/components/schemas/Time" }
    Downtime:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        target: { type: string }
        starts: { $ref: "#/components/schemas/Time" }
        ends: { $ref: "#/components/schemas/Time" }
        author: { type: string }
        comment: { type: string }
        created: { $ref: "#/components/schemas/Time" }
    ServiceDetail:
      allOf:
        - $ref: "#/components/schemas/ServiceView"
        - type: object
          properties:
            last_hard_change: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
            long_output: { type: string }
            duration_ms: { type: [number, "null"] }
            metrics: { type: array, items: { $ref: "#/components/schemas/Metric" } }
            percent_change: { type: [number, "null"], description: Weighted state changes in the last 21 results, 0-100 }
            host_check: { type: boolean }
            check:
              type: object
              properties:
                name: { type: [string, "null"], description: "The check it runs; null for an inline command" }
                service: { type: [string, "null"], description: "The service object it is made from (for for_each services the one they were made from); null for a host's one-off service" }
                assigned: { type: array, items: { type: string }, description: "Why the host has it, e.g. hostgroup linux, servicegroup basics on host web01" }
                command: { type: [string, "null"] }
                interval_s: { type: number }
                retry_interval_s: { type: number }
                timeout_s: { type: number }
                freshness_s: { type: [number, "null"] }
                flap_low: { type: [number, "null"] }
                flap_high: { type: [number, "null"] }
                origin: { type: string, description: "file:line of the service or host service" }
            downtimes: { type: array, items: { type: string }, description: "Downtimes it is in, e.g. hostgroup linux" }
            flags: { type: array, items: { $ref: "#/components/schemas/Flag" }, description: Set on it or its host }
    Metric:
      type: object
      properties:
        name: { type: string }
        value: { type: number }
        unit: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        warn: { type: string, description: Evaluated warning threshold }
        crit: { type: string, description: Evaluated critical threshold }
        perf_warn: { type: string, description: Warning threshold from the plugin output }
        perf_crit: { type: string, description: Critical threshold from the plugin output }
        min: { type: number }
        max: { type: number }
        state: { $ref: "#/components/schemas/State" }
    HostView:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        node: { type: [string, "null"] }
        vars: { type: object, description: "Values are strings, or objects (for_each data)" }
        groups: { type: array, items: { type: string }, description: Host groups }
        enabled: { type: boolean }
        state: { oneOf: [{ $ref: "#/components/schemas/HostState" }, { type: "null" }], description: "From the host check; up without one; null while pending" }
        state_type: { oneOf: [{ $ref: "#/components/schemas/StateType" }, { type: "null" }] }
        attempt: { type: [integer, "null"] }
        max_attempts: { type: [integer, "null"] }
        last_check: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        last_change: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        output: { type: string }
        flapping: { type: boolean }
        check: { type: [string, "null"], description: Host check name }
        graph: { type: [string, "null"], description: "Service whose graphs the host page shows: `graph` of the host, or the host check" }
        worst: { oneOf: [{ $ref: "#/components/schemas/State" }, { type: "null" }], description: Worst service state }
        services: { $ref: "#/components/schemas/Counts" }
        acknowledged: { type: boolean, description: The host problem is acknowledged }
        muted: { type: boolean }
        checks_enabled: { type: boolean }
        downtime: { type: boolean }
    Series:
      type: object
      properties:
        id: { type: integer }
        metric: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        unit: { type: string }
        first: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
        last: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
    Points:
      type: object
      properties:
        bucket: { type: number, description: Bucket width in seconds }
        points:
          type: array
          description: "[unix ms, avg, min, max, count]"
          items: { type: array, items: { type: number }, minItems: 5, maxItems: 5 }
    StateEvent:
      type: object
      properties:
        host: { type: string }
        service: { type: string }
        ts: { $ref: "#/components/schemas/Time" }
        kind: { type: string, enum: [service, host, flap_start, flap_stop], description: "host: UP/DOWN of the host, from its host check" }
        from_state: { type: [string, "null"], description: "A State, or up/down for host events; null for the first result and flapping" }
        to_state: { type: string, description: "A State, or up/down for host events" }
        state_type: { $ref: "#/components/schemas/StateType" }
        hard: { type: boolean }
        output: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        admin: { type: boolean }
        disabled: { type: boolean }
        created: { $ref: "#/components/schemas/Time" }
        last_login: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
    ApiToken:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created: { $ref: "#/components/schemas/Time" }
        last_used: { oneOf: [{ $ref: "#/components/schemas/Time" }, { type: "null" }] }
    Problem:
      type: object
      properties:
        path: { type: [string, "null"] }
        line: { type: integer }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
    ConfigFile:
      type: object
      properties:
        path: { type: string }
        hash: { type: string, description: SHA-256 }
        text: { type: string }
    ConfigObject:
      type: object
      properties:
        kind: { type: string, enum: [check, service, host, hostgroup, servicegroup, contact, contactgroup, notify, sink] }
        name: { type: string }
        path: { type: string }
        line: { type: integer }
        fields: { type: object }
    Edit:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [check, service, host, hostgroup, servicegroup, contact, contactgroup, notify, sink] }
        name: { type: [string, "null"], description: The object to change; null creates one }
        fields: { type: [object, "null"], description: The fields as written, with name; null deletes, example: { name: web01, address: 10.0.0.5, groups: [linux] } }
        path: { type: [string, "null"], description: "New objects: the file, relative to the object directory (default: the kind's ui/ file)" }
    Change:
      type: object
      required: [path]
      properties:
        path: { type: string }
        base: { type: [string, "null"], description: Hash the change was made on; null creates the file }
        text: { type: [string, "null"], description: New text; null deletes the file }
    Delta:
      type: object
      properties:
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
    Changes:
      type: object
      properties:
        hosts: { $ref: "#/components/schemas/Delta" }
        services: { $ref: "#/components/schemas/Delta" }
        groups: { $ref: "#/components/schemas/Delta", description: "As `hostgroup x`, `servicegroup x`, `contactgroup x`" }
        contacts: { $ref: "#/components/schemas/Delta" }
        notify: { $ref: "#/components/schemas/Delta", description: Notify rules by name or place }
        sinks: { $ref: "#/components/schemas/Delta" }
    Group:
      type: object
      properties:
        name: { type: string }
        title: { type: [string, "null"] }
    TreeNode:
      type: object
      properties:
        kind: { type: string, description: "host, service (host/service: on a host, otherwise a service object), check, hostgroup, servicegroup, contact, contactgroup, notify; section or value otherwise" }
        name: { type: string, description: "Object name to link to (host/service for services)" }
        label: { type: string }
        detail: { type: string, description: A value, or why something applies }
        file: { type: string, description: Relative to the object directory }
        line: { type: integer }
        children: { type: array, items: { $ref: "#/components/schemas/TreeNode" } }
